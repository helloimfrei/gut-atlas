[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gut-atlas"
version = "0.1.0"
description = "Reproducible GI disease classification from gut microbiome composition"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Christian Tapp" }]
dependencies = [
    "joblib>=1.3",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.8",
    "scikit-optimize>=0.10",
    "xgboost>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
gut-atlas = "gutatlas.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gutatlas"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
